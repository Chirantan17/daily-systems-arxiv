name: Daily ArXiv Digest

on:
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:

jobs:
  update-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run ArXiv fetcher
        run: python scripts/fetch_papers.py

      - name: Commit and push changes
        run: |
          git config --global user.name "Chirantan Ghosh"
          git config --global user.email "chirantanghosh1745@gmail.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "ci(digest): auto-update research digest for $(date +'%Y-%m-%d')" && git push)
